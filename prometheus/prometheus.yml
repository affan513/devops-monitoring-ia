global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: webapp          # application metrics (requests, latency)
    metrics_path: /metrics
    static_configs:
      - targets: ["webapp:5000"]

  - job_name: cadvisor        # container metrics (CPU, memory, network)
    static_configs:
      - targets: ["cadvisor:8080"]
