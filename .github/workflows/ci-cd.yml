name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r app/requirements.txt
      - name: Unit tests
        working-directory: app
        run: python -m unittest -v
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus" \
            prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/etc/prometheus" \
            prom/prometheus:v2.53.0 check rules /etc/prometheus/alert.rules.yml
      - name: Validate Docker Compose file and dashboard JSON
        run: |
          docker compose config -q
          python -m json.tool grafana/dashboards/app-monitoring.json > /dev/null

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository (dependencies, secrets, misconfigurations)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          exit-code: "1"
      - name: Build web app image
        run: docker build -t webapp:ci ./app
      - name: Scan web app image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: webapp:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy stack and smoke test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Provision the stack (infrastructure as code)
        run: docker compose up -d --build
      - name: Smoke test
        run: ./scripts/smoke_test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/webapp
          docker build -t $IMAGE:latest -t $IMAGE:${GITHUB_SHA::7} ./app
          docker push --all-tags $IMAGE